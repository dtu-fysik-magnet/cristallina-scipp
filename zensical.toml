[project]
site_name = "cristallina-scipp"
site_description = "scipp views of SwissFEL/Cristallina data"
docs_dir = "docs"
site_dir = "site"
nav = [
  {"Home" = "index.md"},
  {"Tutorials" = [
    {"Fluorescence energy scan" = "tutorials/fluorescence-scan.md"},
    {"Rocking curve" = "tutorials/rocking-curve.md"},
    {"Run series" = "tutorials/run-series.md"},
    {"Reciprocal-space map" = "tutorials/rsm.md"},
  ]},
  {"How-to" = [
    {"Install" = "how-to/install.md"},
    {"Find the sample" = "how-to/sample-search.md"},
    {"Describe the experiment" = "how-to/catalogue.md"},
    {"Correct for transmission and absorption" = "how-to/corrections.md"},
    {"Use scattering angles" = "how-to/pixel-angles.md"},
    {"Map cristallina code" = "how-to/from-cristallina.md"},
  ]},
  {"Explanation" = [
    {"Normalisation and errors" = "explanation/normalisation.md"},
    {"Why histogram an RSM" = "explanation/rsm-binning.md"},
  ]},
  {"Reference" = [
    {"API" = "reference/api.md"},
    {"Synthetic scans" = "reference/synthetic.md"},
    {"Building these docs" = "reference/docs.md"},
  ]},
]

[project.theme]
font = false
features = ["content.code.copy", "content.code.annotate", "navigation.footer", "navigation.indexes", "navigation.top", "search.highlight"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
options.docstring_style = "google"
options.show_source = false
options.members_order = "source"
options.heading_level = 2
options.docstring_options.warn_missing_types = false

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
dedent_subsections = true
