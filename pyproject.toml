[project]
name = "cristallina-scipp"
dynamic = ["version"]  # from the git tag, via hatch-vcs
description = "scipp views of SwissFEL/Cristallina data: sfdata -> scipp adapter and binned reciprocal-space maps"
requires-python = ">=3.11"  # tomllib
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Gregory Tucker", email = "gregory.tucker@ess.eu" }]
dependencies = [
    "numpy",
    "scipp>=25.0",
    "plopp",
    "lmfit",
    "scipy",
    "h5py",
    # Not on PyPI ("sfdata" there is an unrelated package), so install from the
    # public repositories, pinned to the commits tested here, so a release always
    # installs the same code. Update the pins deliberately, together with uv.lock.
    "sfdata @ git+https://github.com/paulscherrerinstitute/sf_datafiles.git@ceefaffa78f99cf7dd68e72041b895ee7baf4aed",
    "jungfrau_utils @ git+https://github.com/paulscherrerinstitute/jungfrau_utils.git@b299a6183146294a9ffc843a8b6d4ad08ee4ca4c",
    # imported by sfdata and jungfrau_utils, which declare no dependencies
    "bitshuffle",
    "colorama",
    "numba",
    "pandas",
    "tqdm",
    "xarray",
]

[project.scripts]
cristallina-catalogue = "cristallina_scipp.catalogue:main"

[project.optional-dependencies]
# cristallina.rsm, for pixel_hkl. Its repository carries ~200 MB of test data.
rsm = [
    "cristallina @ git+https://gitea.psi.ch/Cristallina/cristallina_analysis_package.git",
    # imported by cristallina (image.py, rsm.py) but not declared by it
    "scikit-image",
    "uncertainties",
]
notebook = ["jupyterlab", "ipympl"]
test = ["pytest"]
docs = ["cristallina-scipp[rsm]", "zensical", "mkdocstrings-python"]  # the RSM tutorial runs cristallina.rsm

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"  # v0.2.0 -> 0.2.0; between tags e.g. 0.2.1.dev3+gabc1234, so saved results name the commit

[tool.hatch.metadata]
allow-direct-references = true
