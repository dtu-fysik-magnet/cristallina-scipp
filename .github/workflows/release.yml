name: release

# On each published release, build the wheel and source tarball, check that they carry
# the tag's version, and attach them to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version comes from the tag
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: test -f "dist/cristallina_scipp-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - run: gh release upload "$GITHUB_REF_NAME" dist/*
        env:
          GH_TOKEN: ${{ github.token }}
